<!DOCTYPE html>
<html lang="he" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>אישור הגעה - RSVP</title>
    <meta name="description" content="אנא אשר/י את הגעתך לחתונה">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;700&family=Assistant:wght@300;400;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/rsvp-premium.css">
    <link
        href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@300;400;500;700&family=Rubik:wght@300;400;500;700&display=swap"
        rel="stylesheet">
    <style>
        /* Mobile-first fixes */
        * {
            -webkit-tap-highlight-color: transparent;
        }

        body {
            -webkit-text-size-adjust: 100%;
        }

        .phone-input-group {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .phone-prefix {
            background: #f0f0f0;
            padding: 0.8rem 1rem;
            border-radius: 8px;
            font-weight: 500;
            color: #333;
            white-space: nowrap;
        }

        .phone-input-group input {
            flex: 1;
        }

        .help-text {
            display: block;
            font-size: 0.85rem;
            color: #666;
            margin-top: 0.25rem;
        }
    </style>
</head>

<body>
    <!-- Loading / Intro Overlay -->
    <div id="introOverlay" class="intro-overlay">
        <div class="intro-content">
            <div id="introAnimationContainer" class="intro-animation">
                <!-- Animation injected here -->
            </div>
            <h1 id="introTitle" class="intro-title">Loading...</h1>
            <p class="tap-hint">לחץ לפתיחה ✨</p>
        </div>
    </div>

    <!-- Audio Player (Floating) -->
    <button id="musicToggle" class="music-toggle" style="display: none;">
        <span class="music-icon">🎵</span>
    </button>
    <audio id="bgMusic" loop preload="auto"></audio>

    <!-- Main Content - VISIBLE BY DEFAULT (intro overlay will cover if needed) -->
    <div id="mainContent" class="rsvp-page">

        <!-- Top Lottie Decoration -->
        <div id="topLottieContainer" class="lottie-decoration lottie-top"></div>

        <!-- Hero Section -->
        <header class="rsvp-hero">
            <div class="hero-content">
                <p id="welcomeTextDisplay" class="hero-subtitle">ברוכים הבאים</p>
                <h1 id="namesTitleDisplay" class="hero-title">Names</h1>
                <div class="hero-date">
                    <span id="eventDateDisplay">DD.MM.YYYY</span>
                    <span class="separator">•</span>
                    <span id="eventTimeDisplay">00:00</span>
                </div>
            </div>
        </header>

        <!-- Flowers Lottie Decoration (Optional) -->
        <div id="flowersLottieContainer" class="lottie-decoration lottie-flowers"></div>

        <div class="container">
            <!-- Event Details Card -->
            <div class="details-card section-reveal">
                <h2>פרטי האירוע</h2>
                <div class="details-grid">
                    <div class="detail-item">
                        <span class="detail-icon">📍</span>
                        <div class="detail-text">
                            <strong id="venueNameDisplay">Venue Name</strong>
                            <p id="venueAddressDisplay">Address City</p>
                        </div>
                    </div>
                </div>

                <div class="nav-buttons">
                    <a id="wazeBtn" href="#" target="_blank" class="nav-btn waze">
                        <span class="icon">🚙</span> Waze
                    </a>
                    <a id="mapsBtn" href="#" target="_blank" class="nav-btn google">
                        <span class="icon">🗺️</span> Maps
                    </a>
                </div>
            </div>

            <!-- RSVP Form (Original Logic Preserved) -->
            <div class="rsvp-card section-reveal">
                <div class="card-header">
                    <h2>אישור הגעה 💌</h2>
                    <p class="subtitle">נשמח לדעת אם תוכל/י להגיע</p>
                </div>

                <form id="rsvpForm" class="rsvp-form">
                    <!-- Guest Name (editable) -->
                    <div class="form-group">
                        <label for="guestName">שם מלא *</label>
                        <input type="text" id="guestName" name="guestName" required placeholder="הכנס/י את שמך המלא">
                    </div>

                    <!-- Phone Number (visible and editable) -->
                    <div class="form-group">
                        <label for="guestPhone">מספר טלפון *</label>
                        <div class="phone-input-group">
                            <span class="phone-prefix">+972</span>
                            <input type="tel" id="guestPhone" name="guestPhone" required placeholder="50-123-4567"
                                pattern="[0-9\-]+" inputmode="tel">
                        </div>
                        <small class="help-text">הזן/י את מספר הטלפון ללא קידומת המדינה</small>
                    </div>

                    <!-- Attendance Question -->
                    <div class="form-group">
                        <label class="main-question">האם תוכל/י להגיע? *</label>
                        <div class="radio-group">
                            <label class="radio-option">
                                <input type="radio" name="attending" value="yes" required>
                                <span class="radio-custom"></span>
                                <span class="radio-label">כן, אגיע בשמחה! 🎉</span>
                            </label>
                            <label class="radio-option">
                                <input type="radio" name="attending" value="no" required>
                                <span class="radio-custom"></span>
                                <span class="radio-label">לצערי, לא אוכל להגיע 😔</span>
                            </label>
                        </div>
                    </div>

                    <!-- Conditional Questions (shown only if attending) -->
                    <div id="attendingQuestions" class="conditional-section" style="display: none;">
                        <!-- Number of Guests -->
                        <div class="form-group">
                            <label for="numberOfGuests">כמה אורחים יגיעו? (כולל אותך)</label>
                            <input type="number" id="numberOfGuests" name="numberOfGuests" value="1"
                                inputmode="numeric">
                        </div>

                        <!-- Children -->
                        <div class="form-group">
                            <label class="checkbox-label">
                                <input type="checkbox" id="hasChildren" name="hasChildren">
                                <span class="checkbox-custom"></span>
                                <span>יגיעו ילדים 👶</span>
                            </label>
                        </div>

                        <!-- Additional Notes -->
                        <div class="form-group">
                            <label for="notes">הערות נוספות (אופציונלי)</label>
                            <textarea id="notes" name="notes" rows="3"
                                placeholder="רגישויות מזון, בקשות מיוחדות..."></textarea>
                        </div>
                    </div>

                    <!-- Submit Button -->
                    <button type="submit" class="submit-button" id="submitBtn">
                        <span id="btnText">שלח אישור</span>
                        <span id="btnLoader" class="loader" style="display: none;"></span>
                    </button>

                    <!-- Error Message -->
                    <div id="errorMessage" class="error-message" style="display: none;"></div>
                </form>
            </div>

            <footer class="rsvp-footer">
                <p id="thankYouTextDisplay" style="display: none;"></p>
                <div class="footer-credit">נוצר באהבה ❤️</div>
            </footer>
        </div>
    </div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

    <!-- RSVP Logic (Original - Backend Integration) -->
    <script src="js/rsvp.js"></script>
    
    <!-- Premium Effects (Video, Lottie, Audio, Smooth Scroll) -->
    <script src="js/rsvp-premium-effects.js"></script>
</body>

</html>
