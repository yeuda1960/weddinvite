<!DOCTYPE html>
<html lang="he" dir="rtl">

<head>
    <!-- BUILD_ID: 20260123-1200 -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>אישור הגעה - RSVP</title>
    <meta name="description" content="אנא אשר/י את הגעתך לחתונה">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;700&family=Assistant:wght@300;400;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="css/style.css?v=20260123-1200">
    <link rel="stylesheet" href="css/rsvp-premium.css?v=20260123-1200">
    <link
        href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@300;400;500;700&family=Rubik:wght@300;400;500;700&display=swap"
        rel="stylesheet">
    <style>
        /* Mobile-first fixes */
        * {
            -webkit-tap-highlight-color: transparent;
        }

        body {
            -webkit-text-size-adjust: 100%;
        }

        .phone-input-group {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .phone-prefix {
            background: #f0f0f0;
            padding: 0.8rem 1rem;
            border-radius: 8px;
            font-weight: 500;
            color: #333;
            white-space: nowrap;
        }

        .phone-input-group input {
            flex: 1;
        }

        .help-text {
            display: block;
            font-size: 0.85rem;
            color: #666;
            margin-top: 0.25rem;
        }
    </style>
</head>

<body>
    <!-- Loading / Intro Overlay -->
    <div id="introOverlay" class="intro-overlay">
        <div class="intro-content">
            <div id="introAnimationContainer" class="intro-animation">
                <!-- Animation injected here -->
            </div>
            <h1 id="introTitle" class="intro-title">Loading...</h1>
            <p class="tap-hint">לחץ לפתיחה ✨</p>
        </div>
    </div>

    <!-- Audio Player (Floating) -->
    <button id="musicToggle" class="music-toggle" style="display: none;">
        <span class="music-icon">🎵</span>
    </button>
    <audio id="bgMusic" loop preload="auto"></audio>

    <!-- Main Content - VISIBLE BY DEFAULT (intro overlay will cover if needed) -->
    <div id="mainContent" class="rsvp-page">

        <!-- A) INVITATION CONTENT (Hero Section with Lottie) -->
        <header class="rsvp-hero">
            <!-- Top Lottie Hero Decoration -->
            <div id="topLottieContainer" class="lottie-decoration lottie-top"></div>
            
            <div class="hero-content">
                <p id="welcomeTextDisplay" class="hero-subtitle">ברוכים הבאים</p>
                <h1 id="namesTitleDisplay" class="hero-title">Names</h1>
                <div class="hero-date">
                    <span id="eventDateDisplay">DD.MM.YYYY</span>
                    <span class="separator">•</span>
                    <span id="eventTimeDisplay">00:00</span>
                </div>
            </div>
        </header>

        <div class="container">
            <!-- Event Details Card -->
            <div class="details-card section-reveal">
                <h2>פרטי האירוע</h2>
                <div class="details-grid">
                    <div class="detail-item">
                        <span class="detail-icon">📍</span>
                        <div class="detail-text">
                            <strong id="venueNameDisplay">Venue Name</strong>
                            <p id="venueAddressDisplay">Address City</p>
                        </div>
                    </div>
                </div>

                <div class="nav-buttons">
                    <a id="wazeBtn" href="#" target="_blank" class="nav-btn waze">
                        <span class="icon">🚙</span> Waze
                    </a>
                    <a id="mapsBtn" href="#" target="_blank" class="nav-btn google">
                        <span class="icon">🗺️</span> Maps
                    </a>
                </div>
            </div>

            <!-- RSVP Form (Stepped Flow) -->
            <div class="rsvp-card section-reveal">
                <div class="card-header">
                    <h2>אישור הגעה 💌</h2>
                    <p class="subtitle">נשמח לדעת אם תוכל/י להגיע</p>
                </div>

                <form id="rsvpForm" class="rsvp-form rsvp-stepped">
                    <!-- Step 0: Name & Phone -->
                    <div class="rsvp-step" data-step="0">
                        <div class="form-group">
                            <label for="guestName">שם מלא *</label>
                            <input type="text" id="guestName" name="guestName" required placeholder="הכנס/י את שמך המלא">
                        </div>

                        <div class="form-group">
                            <label for="guestPhone">מספר טלפון *</label>
                            <div class="phone-input-group">
                                <span class="phone-prefix">+972</span>
                                <input type="tel" id="guestPhone" name="guestPhone" required placeholder="50-123-4567"
                                    pattern="[0-9\-]+" inputmode="tel">
                            </div>
                            <small class="help-text">הזן/י את מספר הטלפון ללא קידומת המדינה</small>
                        </div>

                        <button type="button" class="step-button" onclick="rsvpStepper.next()">המשך</button>
                    </div>

                    <!-- Step 1: Attendance & Details Combined (In-Card Stepper) -->
                    <div class="rsvp-step" data-step="1" style="display: none;">
                        <div class="form-group">
                            <label class="main-question">האם תוכל/י להגיע? *</label>
                            
                            <!-- Options Container -->
                            <div class="stepped-options-container">
                                
                                <!-- OPTION 1: YES -->
                                <div class="option-card" data-value="yes">
                                    <div class="option-header" onclick="rsvpStepper.selectOption('yes')">
                                        <div class="radio-indicator"></div>
                                        <span class="option-label">כן, אגיע בשמחה! 🎉</span>
                                    </div>
                                    <!-- Nested Step Content: Coming Details -->
                                    <div class="option-content" id="content-yes" style="display: none;">
                                        <div class="separator-line"></div>
                                        <label for="numberOfGuests">כמה אורחים יגיעו? (כולל אותך)</label>
                                        <div class="guest-counter">
                                            <button type="button" class="counter-btn" onclick="rsvpStepper.decrementGuests()">−</button>
                                            <input type="number" id="numberOfGuests" name="numberOfGuests" value="1" min="1" readonly>
                                            <button type="button" class="counter-btn" onclick="rsvpStepper.incrementGuests()">+</button>
                                        </div>
                                        
                                        <div class="form-group">
                                            <label class="checkbox-label">
                                                <input type="checkbox" id="hasChildren" name="hasChildren">
                                                <span class="checkbox-custom"></span>
                                                <span>יגיעו ילדים 👶</span>
                                            </label>
                                        </div>

                                        <div class="form-group">
                                            <label for="notes">הערות נוספות (אופציונלי)</label>
                                            <textarea id="notes" name="notes" rows="2" placeholder="רגישויות מזון, בקשות מיוחדות..."></textarea>
                                        </div>
                                        
                                        <button type="button" class="step-button" onclick="rsvpStepper.submitFromCard('yes')">שלח אישור הגעה</button>
                                    </div>
                                </div>

                                <!-- OPTION 2: NO -->
                                <div class="option-card" data-value="no">
                                    <div class="option-header" onclick="rsvpStepper.selectOption('no')">
                                        <div class="radio-indicator"></div>
                                        <span class="option-label">לצערי, לא אוכל להגיע 😔</span>
                                    </div>
                                    <!-- Nested Step Content: Not Coming Message -->
                                    <div class="option-content" id="content-no" style="display: none;">
                                        <div class="separator-line"></div>
                                        <div class="form-group">
                                            <label for="notesNo">הודעה (אופציונלי)</label>
                                            <textarea id="notesNo" name="notesNo" rows="2" placeholder="רוצה למסור משהו לזוג?"></textarea>
                                        </div>
                                        <button type="button" class="step-button" onclick="rsvpStepper.submitFromCard('no')">שלח עדכון</button>
                                    </div>
                                </div>

                                <!-- OPTION 3: UNSURE -->
                                <div class="option-card" data-value="undecided">
                                    <div class="option-header" onclick="rsvpStepper.selectOption('undecided')">
                                        <div class="radio-indicator"></div>
                                        <span class="option-label">אני עדיין לא בטוח/ה 🫣</span>
                                    </div>
                                    <!-- Nested Step Content: Undecided Note -->
                                    <div class="option-content" id="content-undecided" style="display: none;">
                                        <div class="separator-line"></div>
                                        <div class="form-group">
                                            <label for="notesUndecided">מתי תדע/י?</label>
                                            <textarea id="notesUndecided" name="notesUndecided" rows="2" placeholder="אנא עדכנ/י אותנו כשתדע/י..."></textarea>
                                        </div>
                                        <button type="button" class="step-button" onclick="rsvpStepper.submitFromCard('undecided')">עדכן בהמשך</button>
                                    </div>
                                </div>

                            </div>
                        </div>

                        <!-- Back Button (Global for step 1) -->
                        <div class="step-actions centered">
                            <button type="button" class="text-button" onclick="rsvpStepper.prev()">נכנסתי עם מספר לא נכון? חזרה</button>
                        </div>
                    </div>

                    <!-- Step Final: Review & Submit -->
                    <div class="rsvp-step" data-step="review" style="display: none;">
                        <div class="review-summary">
                            <h3>סיכום</h3>
                            <div id="reviewContent"></div>
                        </div>

                        <div class="step-actions">
                            <button type="button" class="step-button step-back" onclick="rsvpStepper.prev()">חזור</button>
                            <button type="submit" class="submit-button" id="submitBtn">
                                <span id="btnText">שלח אישור</span>
                                <span id="btnLoader" class="loader" style="display: none;"></span>
                            </button>
                        </div>
                    </div>

                    <!-- Error Message -->
                    <div id="errorMessage" class="error-message" style="display: none;"></div>
                </form>
            </div>

            <footer class="rsvp-footer">
                <p id="thankYouTextDisplay" style="display: none;"></p>
                <div class="footer-credit">נוצר באהבה ❤️</div>
            </footer>
        </div>
    </div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

    <!-- RSVP Stepper (Stepped Form Flow) -->
    <script src="js/rsvp-stepper.js?v=20260123-1200"></script>
    
    <!-- RSVP Logic (Original - Backend Integration) -->
    <script src="js/rsvp.js?v=20260123-1200"></script>
    
    <!-- Premium Effects (Video, Lottie, Audio, Smooth Scroll) -->
    <script src="js/rsvp-premium-effects.js?v=20260123-1200"></script>
    
    <!-- Animations -->
    <script src="js/animations.js?v=20260123-1200"></script>
</body>

</html>
