<!DOCTYPE html>
<html lang="he" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Initialize Config</title>
    <style>
        body {
            font-family: 'Heebo', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            text-align: center;
            padding: 20px;
        }

        .container {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            padding: 40px;
            border-radius: 20px;
            max-width: 500px;
        }

        h1 {
            margin-bottom: 20px;
        }

        button {
            background: white;
            color: #667eea;
            border: none;
            padding: 15px 40px;
            font-size: 18px;
            font-weight: 600;
            border-radius: 50px;
            cursor: pointer;
            margin-top: 20px;
            transition: transform 0.2s;
        }

        button:hover {
            transform: scale(1.05);
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        #status {
            margin-top: 20px;
            font-size: 14px;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>🔧 Initialize Designer Config</h1>
        <p>This will create the initial configuration documents in Firestore.</p>
        <p><strong>Run this once to fix the permission errors.</strong></p>

        <button id="initBtn" onclick="initializeConfig()">
            Initialize Config
        </button>

        <div id="status"></div>
    </div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBeS6LBEAqw9m7zkedM7JDJ1LotFI40sOc",
            authDomain: "wedinvite-ee26d.firebaseapp.com",
            projectId: "wedinvite-ee26d",
            storageBucket: "wedinvite-ee26d.firebasestorage.app",
            messagingSenderId: "960125095932",
            appId: "1:960125095932:web:577ae857092e2f1e972c79"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        const DEFAULT_CONFIG = {
            content: {
                namesTitle: 'לדוגמה: יעל ודן',
                welcomeText: 'שמחים להזמין אתכם לחגוג איתנו',
                thankYouText: 'תודה שאישרתם הגעה! נתראה בחתונה ❤️',
                eventDate: '',
                eventTime: '19:30',
                venueName: '',
                venueAddress: '',
                mapsLink: ''
            },
            media: {
                introAnimation: 'envelope',
                musicUrl: '',
            },
            style: {
                primaryColor: '#D4AF37',
                fontFamily: 'Heebo',
            },
            createdAt: firebase.firestore.FieldValue.serverTimestamp(),
            updatedAt: firebase.firestore.FieldValue.serverTimestamp()
        };

        async function initializeConfig() {
            const btn = document.getElementById('initBtn');
            const status = document.getElementById('status');

            btn.disabled = true;
            btn.textContent = 'Initializing...';
            status.innerHTML = '<p>⏳ Creating documents...</p>';

            try {
                console.log('Initializing invitation config...');

                // Create draft document
                await db.collection('invitationPageConfig').doc('draft').set(DEFAULT_CONFIG);
                console.log('✅ Draft config created');
                status.innerHTML += '<p>✅ Draft created</p>';

                // Create published document
                await db.collection('invitationPageConfig').doc('published').set({
                    ...DEFAULT_CONFIG,
                    publishedAt: firebase.firestore.FieldValue.serverTimestamp()
                });
                console.log('✅ Published config created');
                status.innerHTML += '<p>✅ Published created</p>';

                // Verify
                const draftDoc = await db.collection('invitationPageConfig').doc('draft').get();
                if (draftDoc.exists) {
                    console.log('✅ Verification passed');
                    status.innerHTML += '<p>✅ Verification passed</p>';
                    status.innerHTML += '<p><strong>Success! Now go to the Designer page.</strong></p>';
                    btn.textContent = 'Done ✅';
                }

            } catch (error) {
                console.error('❌ Error:', error);
                status.innerHTML = `<p style="color: #ffcccc;">❌ Error: ${error.message}</p>`;
                status.innerHTML += '<p>Check console for details.</p>';
                btn.disabled = false;
                btn.textContent = 'Try Again';
            }
        }
    </script>
</body>

</html>
